name: Security

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev, stable]
  schedule:
    # Daily at 09:11 Singapore time; scheduled scans use the default branch.
    - cron: "11 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      # Allow a newer toolchain only when building the scanner itself.
      - name: Install govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check reachable Go vulnerabilities
        run: govulncheck ./...
