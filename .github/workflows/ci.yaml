name: ci

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: checklist-test
          POSTGRES_DB: ournezt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:checklist-test@localhost:5432/ournezt_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install tools
        # Tool builds may need newer Go; application generation/tests keep Go 1.25.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          # buf.gen.yaml pins remote protoc plugins; no local plugins are needed.

      - name: Generate proto
        run: make proto

      - name: Generate sqlc
        run: make sqlc

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are not committed:"
            git status --short
            git diff
            exit 1
          fi

      - name: Format check
        run: |
          gofmt -l .
          if [ -n "$(git status --porcelain)" ]; then
            echo "Go files are not formatted:"
            git status --short
            git diff
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t ournezt-core:test .
